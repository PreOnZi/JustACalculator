			shellScript = "cd \"$SRCROOT/..\"\n\n# Gradle builds the shared framework, and Gradle cannot start without a JDK.\n# Xcode Cloud's images ship none — that is why this phase failed there while\n# working on a developer Mac, where the Android Studio fallback below finds one.\n#\n# Discovery is deliberately broad rather than a list of fixed paths: the first\n# attempt at this hardcoded /opt/homebrew and assumed ci_post_clone.sh had run,\n# and it still came back \"no JDK found\". So ask Homebrew where it actually\n# lives, glob for any JDK it has, and look in the system JVM directory too.\npick_java() {\n  if [ -z \"$FOUND_JAVA\" ] && [ -n \"$1\" ] && [ -x \"$1/bin/java\" ]; then\n    FOUND_JAVA=\"$1\"\n  fi\n}\n\nscan_for_java() {\n  pick_java \"$JAVA_HOME\"\n  pick_java \"$(/usr/libexec/java_home 2>/dev/null)\"\n  if command -v brew > /dev/null 2>&1; then\n    BREW_PREFIX=\"$(brew --prefix 2>/dev/null)\"\n    for d in \"$BREW_PREFIX\"/opt/openjdk*/libexec/openjdk.jdk/Contents/Home; do pick_java \"$d\"; done\n  fi\n  for d in /opt/homebrew/opt/openjdk*/libexec/openjdk.jdk/Contents/Home; do pick_java \"$d\"; done\n  for d in /usr/local/opt/openjdk*/libexec/openjdk.jdk/Contents/Home; do pick_java \"$d\"; done\n  for d in /Library/Java/JavaVirtualMachines/*/Contents/Home; do pick_java \"$d\"; done\n  pick_java \"/Applications/Android Studio.app/Contents/jbr/Contents/Home\"\n}\n\nFOUND_JAVA=\"\"\nscan_for_java\n\n# Nothing on the machine. On CI, install one here rather than depending on\n# ci_scripts/ci_post_clone.sh having been found and run — Xcode Cloud only\n# looks for that folder in particular places, and a build should not fail over\n# where a helper script happens to sit. Never reached on a developer Mac, which\n# has already matched above.\nif [ -z \"$FOUND_JAVA\" ] && command -v brew > /dev/null 2>&1; then\n  echo \"warning: no JDK on this machine; installing one for Gradle (expect a slower build)\"\n  brew install --quiet openjdk@21 || brew install --quiet openjdk || true\n  scan_for_java\nfi\n\nif [ -z \"$FOUND_JAVA\" ]; then\n  echo \"error: no JDK found, so Gradle cannot build the shared framework.\" >&2\n  echo \"note: looked in JAVA_HOME, /usr/libexec/java_home, Homebrew's prefix,\" >&2\n  echo \"note: /Library/Java/JavaVirtualMachines, and Android Studio's bundled JBR.\" >&2\n  echo \"note: brew present: $(command -v brew > /dev/null 2>&1 && echo yes || echo no)\" >&2\n  exit 1\nfi\n\nexport JAVA_HOME=\"$FOUND_JAVA\"\necho \"Using JAVA_HOME=$JAVA_HOME\"\n\n./gradlew :app:embedAndSignAppleFrameworkForXcode\n";
